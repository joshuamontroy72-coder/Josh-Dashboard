name: Data Pipeline

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  scrape-and-save:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install jsdom --no-save

      - name: Run Scraper
        run: node scaper.cjs

      - name: Commit and Push new data
        run: |
          git config --global user.name "new_vaccine_dashboard"
          git config --global user.email "schoolbaclic@gmail.com"
          git add public/news_data.json
          git commit -m "Automated data refresh" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main
